name: Verify Release Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository, tests, provenance, and exact tag
        run: |
          tools/verify.sh
          python3 tools/release_audit.py --since-tag v0.7.0 --require-external-evidence
          tools/release-smoke.sh
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            sbom/agent-team-engineering.spdx.json
            supply-chain/source-provenance.json
          if-no-files-found: error
          retention-days: 30
