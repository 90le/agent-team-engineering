name: Verify Release Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository, tests, provenance, and exact tag
        run: |
          tools/verify.sh
          python3 tools/release_audit.py --since-tag v0.9.0 --require-external-evidence
          tools/release-smoke.sh
      - name: Generate immutable tag-workflow evidence
        run: |
          python3 tools/release_evidence.py --output artifacts/release-evidence.json --checksums artifacts/SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/release-evidence.json").read_text(encoding="utf-8"))
          assert evidence["evidence_kind"] == "TAG_WORKFLOW_EVIDENCE"
          assert evidence["status"] == "PARTIAL"
          assert evidence["release_status"] == "NOT_PUBLISHED"
          assert evidence["publication"]["tag_workflow"]["status"] == "NOT_RUN"
          assert evidence["publication"]["github_release"]["status"] == "NOT_RUN"
          assert evidence["publication"]["anonymous_install"]["status"] == "NOT_RUN"
          PY
      - name: Upload release evidence
        id: upload-release-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload-release-evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-release-evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-release-evidence.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_URL"
          case "$ARTIFACT_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) exit 1 ;;
          esac
          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_url=$ARTIFACT_URL"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "retention_days=30"
          } >> "$GITHUB_STEP_SUMMARY"
