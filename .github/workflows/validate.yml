name: Validate Agent Team Factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate contracts and repository
        run: python3 tools/agent_team.py validate
      - name: Run unit and security tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit release metadata, provenance, and changed history
        run: python3 tools/release_audit.py --since-tag v0.8.1
      - name: Run complete simulation
        run: python3 tools/agent_team.py simulate --approve-production
      - name: Generate and validate an instance
        run: make instance-smoke
      - name: Generate and validate a context-first team
        run: make context-smoke
      - name: Verify clean-clone bootstrap
        run: tools/cold-start.sh
      - name: Verify exact release-tag context
        run: tools/release-smoke.sh
