name: Agent Team v1.0 SCM Conformance

on:
  workflow_dispatch:
    inputs:
      framework_commit:
        description: Exact reviewed commit in 90le/agent-team-engineering
        required: true
        type: string
      base_commit:
        description: Exact current main commit of this dedicated repository
        required: true
        type: string
      approved_plan_digest:
        description: Exact digest printed by the reviewed framework tool
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-team-v10-scm-conformance
  cancel-in-progress: false

jobs:
  proposal-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout dedicated evidence repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_commit }}
          path: evidence-repository
          persist-credentials: false
      - name: Checkout exact public framework commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 90le/agent-team-engineering
          ref: ${{ inputs.framework_commit }}
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify exact approval and reconcile proposal-only objects
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          APPROVED_PLAN_DIGEST: ${{ inputs.approved_plan_digest }}
          APPROVED_BASE_COMMIT: ${{ inputs.base_commit }}
          APPROVED_FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          APPROVED_FRAMEWORK_REPOSITORY: 90le/agent-team-engineering
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 framework/tools/github_scm_conformance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-id repo.conformance.github.v10 \
            --base-commit "${{ inputs.base_commit }}" \
            --framework-commit "${{ inputs.framework_commit }}" \
            --expected-actor-id REPLACE_WITH_NUMERIC_OWNER_ID \
            --output "artifacts/github-scm-conformance.json"
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-scm-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-scm-conformance.json
          if-no-files-found: error
          retention-days: 30
